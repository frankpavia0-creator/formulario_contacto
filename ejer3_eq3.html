<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Imagen con un Botón</title>
</head>
<body>

    <!-- El Botón -->
    <button id="miBoton">Mostrar Imagen</button>
    
    <br><br>

    <!-- La Imagen (oculta por defecto con style="display: none;") -->
    <img id="miImagen" src="https://picsum.photos/300/200" style="display: none;" alt="Imagen de ejemplo">

    <script>
        const boton = document.getElementById('miBoton');
        const imagen = document.getElementById('miImagen');

        // Al hacer clic, cambia el estilo de la imagen para que aparezca
        boton.addEventListener('click', () => {
            imagen.style.display = 'block';
            boton.style.display = 'none'; // (Opcional) Oculta el botón después de hacer clic
        });
    </script>

</body>
</html>
