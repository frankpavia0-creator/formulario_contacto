<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ponte en contacto con nosotros directamente a través de nuestro formulario o por WhatsApp. Estamos listos para atender tus dudas y comentarios.">
    <meta name="keywords" content="contacto, whatsapp, formulario de contacto, atención al cliente, soporte">
    <meta name="author" content="Frank">
    <title>Formulario de Contacto</title>
    <!-- Iconos de Font Awesome para el logo de WhatsApp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a34444 0%, #ff0f6b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            padding: 30px;
            background: #ffffff;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-section h2 {
            color: #333333 !important;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 3px solid #ea8066;
            display: inline-block;
            padding-bottom: 5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #222222 !important;
            font-weight: bold;
            font-size: 14px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #cccccc;
            background-color: #ffffff !important;
            color: #000000 !important;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: #25d366;
        }

        /* Estilo integrado y unificado para el widget del Clima */
        .weather-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #e9ecef;
        }

        .weather-box h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #25d366;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .weather-inputs {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .weather-inputs input {
            padding: 8px 10px;
            font-size: 13px;
            border-radius: 6px;
            border: 2px solid #cccccc;
            background: #ffffff;
            color: #333;
            width: 100%;
        }

        .weather-inputs input:focus {
            border-color: #25d366;
            outline: none;
        }

        .btn-weather {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn-weather:hover {
            background-color: #1ebe5d;
        }

        #weatherResult {
            font-size: 13px;
            color: #333333;
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #dcdcdc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .captcha-box {
            background: #f0f3ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            border: 1px dashed #25d366;
        }

        .captcha-box label {
            color: #111111 !important;
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
            font-size: 14px;
        }

        .captcha-box input {
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white !important;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: background 0.3s, transform 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: #1ebe5d;
            transform: translateY(-2px);
        }

        .map-section {
            background: #e9ecef;
            position: relative;
            min-height: 350px;
        }

        .map-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Start of Tawk.to Script -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6abea417282c813443c70d54/1k3sb1upj';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
    <!-- End of Tawk.to Script -->

    <div class="container">
        <!-- Sección del Formulario -->
        <div class="form-section">
            <h2>Contáctanos</h2>
            <form id="contactForm" onsubmit="enviarWhatsApp(event)">
                <div class="input-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required maxlength="70" placeholder="Tu nombre completo">
                </div>

                <div class="input-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" required maxlength="15" placeholder="Tu número de teléfono">
                </div>

                <div class="input-group">
                    <label for="comentario">Comentario:</label>
                    <textarea id="comentario" rows="3" required placeholder="Escribe tu mensaje..."></textarea>
                </div>

                <!-- Widget del Clima Integrado y Armonizado -->
                <div class="weather-box">
                    <h3><i class="fa-solid fa-cloud-sun"></i> Consultar Clima Local (Open-Meteo)</h3>
                    <div class="weather-inputs">
                        <input type="text" id="latInput" placeholder="Latitud" value="52.52">
                        <input type="text" id="lonInput" placeholder="Longitud" value="13.41">
                        <button type="button" class="btn-weather" onclick="consultarClima()">Ver Clima</button>
                    </div>
                    <div id="weatherResult">Haz clic en "Ver Clima" para consultar la API.</div>
                </div>

                <!-- CAPTCHA Matemático Simple -->
                <div class="captcha-box">
                    <label for="captchaInput" id="captchaQuestion">Cargando...</label>
                    <input type="number" id="captchaInput" required placeholder="Escribe el resultado">
                </div>

                <button type="submit" class="btn-whatsapp">
                    <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i>
                    Enviar por WhatsApp
                </button>
            </form>
        </div>

        <div class="map-section">
            <!-- Mapa incrustado de Google Maps -->
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3775.6!2d-98.46!3d18.59!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTjCsDM1JzM2LjAiTiA5OMKwMjcnMzYuMCJX!5e0!3m2!1ses!2smx!4v1620000000000!5m2!1ses!2smx" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        // Generar un CAPTCHA matemático aleatorio cada vez que se carga la página
        let num1 = Math.floor(Math.random() * 10) + 1;
        let num2 = Math.floor(Math.random() * 10) + 1;
        let respuestaCorrecta = num1 + num2;
        document.getElementById('captchaQuestion').innerText = `¿Cuánto es ${num1} + ${num2}?`;

        // Restringir entrada en el campo de Nombre (Bloquea números y limita a 70 caracteres)
        document.getElementById('nombre').addEventListener('input', function(e) {
            this.value = this.value.replace(/[0-9]/g, '').slice(0, 70);
        });

        // Restringir entrada en el campo de Teléfono (Bloquea letras/símbolos excepto + y limita a 15 caracteres)
        document.getElementById('telefono').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9+]/g, '').slice(0, 15);
        });

        // Función para consultar la API de Open-Meteo de forma dinámica
        async function consultarClima() {
            const lat = document.getElementById('latInput').value;
            const lon = document.getElementById('lonInput').value;
            const resultadoDiv = document.getElementById('weatherResult');
            
            resultadoDiv.innerText = "Consultando Open-Meteo...";

            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m`);
                const data = await response.json();

                if(data && data.current) {
                    const temp = data.current.temperature_2m;
                    const viento = data.current.wind_speed_10m;
                    const hora = data.current.time;
                    resultadoDiv.innerHTML = `<strong>Hora:</strong> ${hora}<br><strong>Temp:</strong> ${temp} °C | <strong>Viento:</strong> ${viento} km/h`;
                } else {
                    resultadoDiv.innerText = "No se pudieron obtener los datos.";
                }
            } catch (error) {
                resultadoDiv.innerText = "Error al conectar con la API.";
            }
        }

        function enviarWhatsApp(event) {
            event.preventDefault();

            // Validar la respuesta del CAPTCHA
            const respuestaUsuario = parseInt(document.getElementById('captchaInput').value);
            if (respuestaUsuario !== respuestaCorrecta) {
                alert("El resultado del CAPTCHA es incorrecto. Inténtalo de nuevo.");
                return;
            }

            // Obtener los datos escritos por el usuario
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const comentario = document.getElementById('comentario').value;

            // Número de WhatsApp
            const tuNumeroWhatsApp = "13478814790"; 

            // Estructurar el mensaje
            const mensaje = "Hola, mi nombre es " + nombre + ". Mi teléfono es: " + telefono + ". Comentario: " + comentario;

            // URL directa para abrir el chat de WhatsApp
            const urlWhatsApp = "https://wa.me/" + tuNumeroWhatsApp + "?text=" + encodeURIComponent(mensaje);

            // Abrir la ventana de WhatsApp
            window.open(urlWhatsApp, '_blank');
        }
    </script>

</body>
</html>
