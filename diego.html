<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Botón</title>
    <style>
        button.mybuton {
          background-color: #007bff;
          color: white;
          padding: 20px 30px;
          font-size: 16px;
          border: none;
          border-radius:12222px;
          cursor: pointer;
          transition: background 0.3s;
        }

        button.mybuton:hover {
          background-color: #0056b3;
        }
    </style>
</head>
<body>
   <center><button class="mybuton">Haz clic</button></center> 
</body>
</html>
