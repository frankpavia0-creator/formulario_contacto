<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .titulo-principal {
            font-size: 48px;
            text-decoration: underline;
            letter-spacing: 10px;
        }

        .micaja {
            width: 400px;
            height: 250px;
            background-color: #4A90E2;
            border-radius: 20px;
            position: relative;
            margin: 50px auto;
        }
        .dibujo {
            position: absolute;
            width: 50px;  
            height: 50px; 
            object-fit: contain; 
        }
        .di1 { top: -25px; left: -25px; }       
        .di2 { top: -25px; right: -25px; }     
        .di3 { bottom: -25px; left: -25px; }            
        .di4 { bottom: -25px; right: -25px; }   
        .di5 { top: -25px; left: calc(50% - 25px); }
    </style>
</head>
<body style="background-image: url(OIP.webp); background-size: cover;">
    <center>
        <h1 class="titulo-principal">Bienvenido a mi sitio ^w^</h1>
        
        <div class="micaja">
            <img src="mica1.webp" class="dibujo di1" alt="dibujo1">
            <img src="pica2.webp" class="dibujo di2" alt="dibujo2">
            <img src="pica3.webp" class="dibujo di3" alt="dibujo3">
            <img src="pica4.png" class="dibujo di4" alt="dibujo4">
            <img src="pica5.png" class="dibujo di5" alt="dibujo5"><br>
            <h2>¿Que te gusta</h2>
            <div class="lista">
                <label><input type="checkbox" name="comida" value="Tamales">Tamales</label>
                <label><input type="checkbox" name="comida" value="Atole">Atole</label>
                <label><input type="checkbox" name="comida" value="Tortas">Tortas</label>
                <label><input type="checkbox" name="comida" value="Piña">Piña</label>
            </div>

        </div>
       
    </center>
</body>
</html>
